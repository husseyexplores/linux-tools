[package]
name = "dsk"
version = "0.1.0"
edition = "2021"
description = "Fast, pretty disk usage explorer and cache cleaner"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
globset = "0.4"
nix = { version = "0.29", features = ["fs", "user"] }
ratatui = "0.29"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
trash = "5"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
